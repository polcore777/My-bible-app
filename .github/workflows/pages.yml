name: Deploy web app (PWA) to Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/www/**'
      - 'app/src/main/assets/modules/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -eu
          mkdir -p _site/modules
          # shared UI (also used by the Android build)
          cp app/src/main/assets/www/app.css \
             app/src/main/assets/www/app.js \
             app/src/main/assets/www/books.js \
             app/src/main/assets/www/morph.js _site/
          # web-app shell + data layer + vendored sql.js
          cp pwa/index.html pwa/bridge-core.js pwa/bridge.js pwa/boot.js pwa/sw.js \
             pwa/manifest.webmanifest pwa/catalog.json \
             pwa/sql-wasm.js pwa/sql-wasm.wasm \
             pwa/icon-192.png pwa/icon-512.png pwa/apple-touch-icon.png _site/
          # module databases
          cp app/src/main/assets/modules/*.db _site/modules/
          touch _site/.nojekyll
          echo "Assembled $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
